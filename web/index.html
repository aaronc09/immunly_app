<!doctype html>
<html lang="en">
  <head>
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which won't cause the browser to attempt to load the new url.
      // When the single page app is loaded further down in this file,
      // the correct url will be waiting in the browser's history for
      // the single page app to route accordingly.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <!-- Apply the theme before first paint so the page never flashes light.
         Mirrors ThemeContext: dark unless the visitor picked light. -->
    <script>
      document.documentElement.setAttribute(
        'data-theme',
        localStorage.getItem('immunly_theme') === 'light' ? 'light' : 'dark'
      );
    </script>

    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Google Analytics only loads after the visitor picks "Accept all" in the
      // cookie banner (see src/lib/cookieConsent.ts). Commands below queue in
      // dataLayer and run once gtag.js arrives. A choice stored on an earlier
      // visit is re-applied here, before React starts.
      gtag('consent', 'default', {
        analytics_storage: 'denied',
      });
      if (localStorage.getItem('immunly_cookie_consent') === 'granted') {
        gtag('consent', 'update', { analytics_storage: 'granted' });
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-TPJ9F0QZKH';
        ga.setAttribute('data-immunly-ga', 'true');
        document.head.appendChild(ga);
      }

      gtag('js', new Date());

      // send_page_view is disabled here because this is a single-page app —
      // React Router changes routes without a real page load, so the initial
      // automatic pageview wouldn't fire again on navigation. PageTransition
      // sends page_view events manually on every route change instead.
      gtag('config', 'G-TPJ9F0QZKH', { send_page_view: false });
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/immunlylogolight.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immunly — Immunology, Simply</title>
    <meta name="description" content="Learn immunology and biomedical research through interactive lessons, landmark papers, and quizzes. Free and open access." />

    <!-- Social preview (Open Graph + Twitter Card) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://immunly.org/" />
    <meta property="og:title" content="Immunly — Immunology, Simply" />
    <meta property="og:description" content="Learn immunology and biomedical research through interactive lessons, landmark papers, and quizzes. Free and open access." />
    <meta property="og:image" content="https://immunly.org/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Immunly — Immunology, Simply" />
    <meta name="twitter:description" content="Learn immunology and biomedical research through interactive lessons, landmark papers, and quizzes. Free and open access." />
    <meta name="twitter:image" content="https://immunly.org/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Playfair+Display:ital,wght@0,500..800;1,500..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
